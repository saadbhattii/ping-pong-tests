name: watchdog

on:
  schedule:
    # Loose on purpose — this only needs to catch a dead chain
    # eventually, not on a tight timer. Offset from the top of the
    # hour (:17 instead of :00) to avoid GitHub's busiest queue moment.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      restart_hops:
        description: "Hops to seed the chain with if it's found dead"
        required: false
        default: "5"

permissions:
  contents: write   # required by the keepalive step to push a marker commit

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent this workflow's own schedule from being disabled after 60 quiet days
        run: |
          last_commit_epoch=$(git log -1 --format=%ct)
          now_epoch=$(date -u +%s)
          days_quiet=$(( (now_epoch - last_commit_epoch) / 86400 ))

          echo "Repo has been quiet for $days_quiet day(s)."

          if [ "$days_quiet" -ge 45 ]; then
            echo "Approaching the 60-day auto-disable threshold — pushing a keepalive commit."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
            git add .github/.keepalive
            git commit -m "chore: keepalive"
            git push
          else
            echo "No action needed yet."
          fi

  check-and-restart:
    runs-on: ubuntu-latest
    needs: keepalive
    steps:
      - name: Check if anything is currently running, restart if not
        env:
          GH_TOKEN: ${{ secrets.PING_PONG_TOKEN }}
          RESTART_HOPS: ${{ inputs.restart_hops || '20' }}
        run: |
          repo="${{ github.repository }}"
          anything_active=false

          for wf in ping.yml pong.yml; do
            status=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/actions/workflows/$wf/runs?per_page=1" \
              | jq -r '.workflow_runs[0].status // empty')

            echo "$wf most recent run status: ${status:-none found}"

            if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
              anything_active=true
            fi
          done

          if [ "$anything_active" = true ]; then
            echo "✓ Something is actively running right now — nothing to do."
          else
            echo "⚠ Nothing queued or in progress for ping or pong — restarting."

            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/actions/workflows/ping.yml/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"hops\":\"$RESTART_HOPS\"}}")

            if [ "$response" -eq 204 ]; then
              echo "→ Restarted chain via ping.yml (hops=$RESTART_HOPS)"
            else
              echo "✗ Failed to restart chain, HTTP $response"
              exit 1
            fi
          fi